# GitHub Actions workflow that integrates with Orca + Workshop
name: Orca-Powered CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Weekly release preparation - Every Friday at 10 AM UTC
    - cron: '0 10 * * FRI'
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        default: 'patch'
        type: choice
        options:
          - major
          - minor
          - patch

jobs:
  # Run tests in Workshop environment
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        test-type: [unit, integration]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed for release notes
      
      - name: Install Workshop
        run: |
          sudo snap install --channel=6/stable lxd || true
          sudo snap refresh lxd --channel=6/stable || true
          sudo snap install --classic workshop
      
      - name: Launch Workshop test environment
        run: |
          workshop launch test
          workshop shell test -- ./scripts/run-tests.sh ${{ matrix.test-type }}
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.test-type }}
          path: test-results/
      
      - name: Generate test report with AI
        if: always()
        run: |
          # Orca AI agent generates human-readable test report
          orca agent run --task "analyze-test-results" \
            --input "test-results/" \
            --output "test-report.md"
      
      - name: Comment test results on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('test-report.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });

  # AI-powered code review
  code-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: AI Code Review with Claude
        run: |
          orca agent run claude \
            --task "code-review" \
            --context "pr:${{ github.event.pull_request.number }}" \
            --output "review.md"
      
      - name: Post review comments
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const review = fs.readFileSync('review.md', 'utf8');
            github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              body: review,
              event: 'COMMENT'
            });

  # Weekly automated release
  weekly-release:
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 10 * * FRI' || github.event_name == 'workflow_dispatch'
    needs: [test]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Configure Git
        run: |
          git config user.name "Orca Release Bot"
          git config user.email "orca-bot@example.com"
      
      - name: Get last release tag
        id: last_release
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "last_tag=$LAST_TAG" >> $GITHUB_OUTPUT
          echo "Last release: $LAST_TAG"
      
      - name: AI-Generated Release Notes
        id: release_notes
        run: |
          # AI agent analyzes commits and generates release notes
          orca agent run claude \
            --task "generate-release-notes" \
            --since "${{ steps.last_release.outputs.last_tag }}" \
            --output "RELEASE_NOTES.md"
          
          # Read the generated release notes
          cat RELEASE_NOTES.md
      
      - name: Determine version bump
        id: version
        run: |
          # AI determines version bump based on changes
          BUMP_TYPE=$(orca agent run claude \
            --task "determine-version-bump" \
            --since "${{ steps.last_release.outputs.last_tag }}" \
            --default "${{ inputs.release_type || 'patch' }}")
          
          echo "Version bump type: $BUMP_TYPE"
          echo "bump_type=$BUMP_TYPE" >> $GITHUB_OUTPUT
      
      - name: Calculate new version
        id: new_version
        run: |
          LAST_VERSION="${{ steps.last_release.outputs.last_tag }}"
          LAST_VERSION=${LAST_VERSION#v}  # Remove 'v' prefix
          
          IFS='.' read -r MAJOR MINOR PATCH <<< "$LAST_VERSION"
          
          case "${{ steps.version.outputs.bump_type }}" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac
          
          NEW_VERSION="v${MAJOR}.${MINOR}.${PATCH}"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "New version: $NEW_VERSION"
      
      - name: Update version files
        run: |
          NEW_VERSION="${{ steps.new_version.outputs.new_version }}"
          
          # Update package.json if exists
          if [ -f "package.json" ]; then
            jq --arg version "${NEW_VERSION#v}" '.version = $version' package.json > package.json.tmp
            mv package.json.tmp package.json
          fi
          
          # Update Go version file if exists
          if [ -f "version.go" ]; then
            sed -i "s/Version = \".*\"/Version = \"${NEW_VERSION}\"/" version.go
          fi
          
          # Create VERSION file
          echo "$NEW_VERSION" > VERSION
      
      - name: Create release commit
        run: |
          git add -A
          git commit -m "chore: release ${{ steps.new_version.outputs.new_version }}" \
            -m "$(cat RELEASE_NOTES.md)"
      
      - name: Create and push tag
        run: |
          git tag -a "${{ steps.new_version.outputs.new_version }}" \
            -m "Release ${{ steps.new_version.outputs.new_version }}"
          git push origin HEAD:main
          git push origin "${{ steps.new_version.outputs.new_version }}"
      
      - name: Create GitHub Release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const releaseNotes = fs.readFileSync('RELEASE_NOTES.md', 'utf8');
            
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: "${{ steps.new_version.outputs.new_version }}",
              name: "Release ${{ steps.new_version.outputs.new_version }}",
              body: releaseNotes,
              draft: false,
              prerelease: false
            });
      
      - name: Send release notification
        run: |
          echo "🎉 Release ${{ steps.new_version.outputs.new_version }} created!"
          # Add Slack/email notification here if needed

  # AI-powered bug analysis
  analyze-bugs:
    runs-on: ubuntu-latest
    if: github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'bug')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: AI Bug Analysis
        run: |
          orca agent run claude \
            --task "analyze-bug" \
            --issue "${{ github.event.issue.number }}" \
            --output "bug-analysis.md"
      
      - name: Generate test cases
        run: |
          orca agent run codex \
            --task "generate-bug-tests" \
            --input "bug-analysis.md" \
            --output "tests/regression/"
      
      - name: Create PR with tests
        run: |
          git checkout -b "bug-fix-tests-${{ github.event.issue.number }}"
          git add tests/regression/
          git commit -m "test: add regression tests for #${{ github.event.issue.number }}"
          git push origin "bug-fix-tests-${{ github.event.issue.number }}"
          
          # Create PR
          gh pr create \
            --title "Add regression tests for bug #${{ github.event.issue.number }}" \
            --body "Auto-generated regression tests by AI" \
            --base main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
